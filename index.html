<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تغيير كلمة مرور حضوري</title><style>body{font:16px Arial;background:#eff7f5;color:#18342f;margin:0;padding:24px}.card{max-width:440px;margin:30px auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 28px #1232}h1{font-size:22px}input,button{box-sizing:border-box;width:100%;padding:14px;font-size:16px;border:1px solid #a9bdb8;border-radius:9px;margin:8px 0}button{background:#0f766e;color:white;font-weight:bold;border:0}#result{line-height:1.8}small{color:#4b625e}</style></head><body><main class="card"><h1>تأكيد أو استرجاع حساب حضوري</h1><p>افتح الصفحة من الرابط الذي وصلك إلى بريدك.</p><form id="form" hidden><label>كلمة المرور الجديدة<input id="pw" type="password" minlength="10" required autocomplete="new-password"></label><label>تأكيد كلمة المرور<input id="pw2" type="password" minlength="10" required autocomplete="new-password"></label><button id="submit">حفظ كلمة المرور</button></form><p id="result"></p><small>لا ترسل كلمة المرور أو رابط الاسترجاع لأي شخص.</small></main><script>
'use strict';
const params = new URLSearchParams(location.hash.slice(1));
const token = params.get('access_token');
const type = params.get('type');
history.replaceState(null, '', location.pathname);
const result = document.querySelector('#result'), form = document.querySelector('#form');
if(token && type === 'recovery'){form.hidden=false;}else if(token && type === 'signup'){
 result.textContent='جارٍ التحقق من تأكيد البريد...';
 fetch('https://rhjvypbdqcvsoybhbblh.supabase.co/auth/v1/user',{headers:{'apikey':'sb_publishable_w6RhIIvetFyJZxuMCeLZBw_YrEa3CIZ','Authorization':'Bearer '+token}})
 .then(async response=>{if(!response.ok)throw new Error();const user=await response.json();if(!user.email_confirmed_at)throw new Error();result.textContent='✅ تم تأكيد البريد. ارجع إلى تطبيق حضوري. بعد تأكيد البريد، يُفترض إرسال طلبك للمدير. إذا لم يظهر، سجّل الدخول بالبريد لإكمال الطلب.';})
 .catch(()=>{result.textContent='تعذّر التأكد من البريد. اطلب رابط تأكيد جديدًا أو تواصل مع المسؤول.';});
}else{result.textContent='الرابط غير صالح أو انتهت صلاحيته. اطلب رسالة جديدة وافتح رابطها مرة واحدة.';}
form.addEventListener('submit', async e => {
 e.preventDefault(); const a=document.querySelector('#pw'), b=document.querySelector('#pw2'), button=document.querySelector('#submit');
 if(a.value!==b.value){result.textContent='كلمتا المرور غير متطابقتين.';return;}
 button.disabled=true; result.textContent='جارٍ حفظ كلمة المرور...';
 try {const response=await fetch('https://rhjvypbdqcvsoybhbblh.supabase.co/auth/v1/user',{method:'PUT',headers:{'apikey':'sb_publishable_w6RhIIvetFyJZxuMCeLZBw_YrEa3CIZ','Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:a.value})}); if(!response.ok) throw new Error(); a.value='';b.value='';form.hidden=true;result.textContent='✅ تم تغيير كلمة المرور. يمكنك الآن الرجوع إلى تطبيق حضوري وتسجيل الدخول.';}
 catch(_){result.textContent='تعذّر تغيير كلمة المرور. قد يكون الرابط انتهى أو الاتصال منقطعًا؛ اطلب رابطًا جديدًا وحاول مجددًا.';button.disabled=false;}
});
</script></body></html>
